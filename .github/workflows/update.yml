name: Update jobs and website

on:
  schedule:
    - cron: "23 5,17 * * *"   # twice a day, 05:23 and 17:23 UTC
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config/**", "content/**", "site_builder/**"]   # rebuild when settings or pages change

permissions:
  contents: write   # to save the updated job data
  issues: write     # to open an alert issue when an employer needs a look

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04   # fixed version, so a GitHub system upgrade cannot change it unexpectedly
    timeout-minutes: 120
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check the code still works
        run: python -m pytest -q tests

      - name: Fetch jobs from employers
        if: github.event_name != 'push'
        run: python -m fetcher.run

      - name: Save job data
        if: github.event_name != 'push'
        run: |
          git config user.name "job-fetcher"
          git config user.email "job-fetcher@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update jobs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Build website
        run: python -m site_builder.build

      - name: Create the Cloudflare Pages project if it does not exist yet
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'aerojobs' }}
        run: |
          if npx --yes wrangler@4.147.0 pages project list | grep -qw "$PROJECT"; then
            echo "Project $PROJECT already exists"
          else
            npx --yes wrangler@4.147.0 pages project create "$PROJECT" --production-branch=main
          fi

      - name: Publish website to Cloudflare
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT || 'aerojobs' }} --branch=main --commit-dirty=true

      - name: Report employers that need a look
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m fetcher.report_alerts
