name: Update jobs and website

on:
  schedule:
    - cron: "23 5,17 * * *"   # twice a day, 05:23 and 17:23 UTC
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config/**", "content/**", "site_builder/**"]   # rebuild when settings or pages change

permissions:
  contents: write   # to save the updated job data
  issues: write     # to open an alert issue when an employer needs a look

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check the code still works
        run: python -m pytest -q tests

      - name: Fetch jobs from employers
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m fetcher.run

      - name: Save job data
        if: github.event_name != 'push'
        run: |
          git config user.name "job-fetcher"
          git config user.email "job-fetcher@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update jobs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Build website
        run: python -m site_builder.build

      - name: Create the Cloudflare Pages project (first run only)
        if: env.CF_TOKEN != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CLOUDFLARE_PROJECT || 'aerojobs' }} --production-branch=main

      - name: Publish website to Cloudflare
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT || 'aerojobs' }} --branch=main --commit-dirty=true

      - name: Report employers that need a look
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m fetcher.report_alerts
