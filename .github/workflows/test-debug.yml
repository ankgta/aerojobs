name: Debug tests
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v --tb=long tests 2>&1 | tee test-output.txt; echo "exit=$?" >> test-output.txt
        continue-on-error: true
      - name: Post results as issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTPUT=$(cat test-output.txt)
          gh issue create \
            --title "Test debug $(date -u +%Y-%m-%dT%H:%MZ)" \
            --body "$OUTPUT"
