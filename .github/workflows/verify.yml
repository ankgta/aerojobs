name: Check candidate employers

# Run by hand. Tests the sources listed in config/candidates.yaml and saves
# data/verify_report.json. It does not switch any employer on.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check each candidate
        run: python -m fetcher.verify config/candidates.yaml
      - name: Find the hiring system behind well-known careers pages
        run: python -m fetcher.detect $(grep -v '^#' config/careers_pages.txt) > data/detect_report.txt 2>&1 || true
      - name: Save the report
        run: |
          git config user.name "job-fetcher"
          git config user.email "job-fetcher@users.noreply.github.com"
          git add data/verify_report.json data/detect_report.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Candidate employer check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
