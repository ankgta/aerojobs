name: Find employers in the .aero directory

# Run by hand from the Actions tab (Run workflow). It reads https://information.aero/directory,
# looks for careers pages, and saves two lists in data/ for review. It never switches
# employers on by itself.
on:
  workflow_dispatch:
    inputs:
      check:
        description: "How many websites to check for a careers page"
        default: "300"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read the directory and check careers pages
        env:
          CHECK: ${{ inputs.check }}
        run: python -m fetcher.discover_aero --check "$CHECK"
      - name: Save the lists
        run: |
          git config user.name "job-fetcher"
          git config user.email "job-fetcher@users.noreply.github.com"
          git add data/aero_directory.csv data/aero_candidates.csv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update .aero directory candidates"
          git pull --rebase
          git push
