# Checked 12 Oct 2026 — HTTP errors retry (24h window passed): all still blocked or inaccessible:
#   LATAM Airlines (HTTP 403 block persists), Avianca (HTTP 403 block persists), Copa Airlines (HTTP 401 block persists)
#   Note: detect_report shows these still return HTTP errors when accessed; cannot be added without bypassing blocks.
# Checked 12 Oct 2026 — portal decommissioned:
#   dnata (iCIMS: careers-dnata.icims.com returned 404 on all paths — portal migrated or decommissioned).
# Checked 14 Oct 2026 — verified and enabled:
#   Cathay Pacific (Phenom, 210 jobs).
# Checked 14 Oct 2026 — robots.txt blocks:
