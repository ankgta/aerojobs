# Checked 14 Oct 2026 — SF connector incompatible:
#   Bombardier (SuccessFactors KeyError — missing url field), Dubai Airports v2 (same).
# Custom/JS sites (not yet attempted):
#   Turkish Airlines (custom ASP.NET).
# Unsupported ATS: Emirates (Avature), British Airways (TalentBrew), Aer Lingus (Zellis),
#   WestJet (Dayforce), Kenya Airways (Oracle iRecruitment on-premise), many others (custom sites).
#
# Source examples (copy the shape that matches the hiring system):
#   source: {ats: workday, url: "https://company.wd3.myworkdayjobs.com/SiteName"}
#   source: {ats: greenhouse, board: "companyboardname"}
#   source: {ats: lever, company: "companyname"}            # add region: eu for EU accounts
#   source: {ats: smartrecruiters, company: "CompanyIdentifier"}
#   source: {ats: jsonld, listing_url: "https://careers.example.com/jobs", job_link_pattern: "/job/"}

