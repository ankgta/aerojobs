# The employers the fetcher reads.
#
# Each employer needs a "source" (which hiring system it uses and its address)
# before it can be switched on with enabled: true. Leave enabled: false until the
# source has been checked. Never guess a source: run
#     python -m fetcher.detect <careers page link>
# which looks at the page and suggests the right source.
#
# type: airline | airport | mro | manufacturer | ground_services | other
# country: two-letter country code of the head office (GB, US, AE, IN ...)
#
# Checked 8 Oct 2026 — robots.txt blocks (never attempt to work around these):
#   Qatar Airways (Oracle Fusion API), Menzies Aviation (Oracle Fusion API), Singapore Airlines (SuccessFactors),
#   ST Engineering (SuccessFactors), Lufthansa Group (SmartRecruiters API),
#   flydubai (iCIMS), American Airlines, Delta, KLM, Qantas, IndiGo, AAR, Lufthansa Technik, LATAM,
#   Ethiopian Airlines (careers sites blocked),
#   SITA (iCIMS: careers-sita.icims.com — robots.txt blocks /api/jobs and /jobs/search).
# Checked 12 Oct 2026 — robots.txt blocks (fresh scan):
#   Delta Air Lines, Aeroméxico, Kenya Airways, South African Airways.
# Checked 12 Oct 2026 — HTTP errors (403/401 suggest IP blocks or anti-scraping):
#   LATAM Airlines (HTTP 403), Avianca (HTTP 403), Copa Airlines (HTTP 401).
# Checked 12 Oct 2026 — custom/JS sites (require browser inspection):
#   Turkish Airlines, Bombardier.
# Checked 12 Oct 2026 — retested 0-jobs employers: all 4 now enabled (verified 12 Oct 14:07 UTC):
#   Ryanair (Workable: 0 jobs — enabled, no current openings),
#   Saudia (Taleo section sv_externalcareersection: 0 jobs — enabled, no current openings),
#   easyJet (Taleo section 2: 0 jobs — enabled, no current openings),
#   Azul Airlines (Gupy: 0 jobs — enabled, no current openings),
#   Virgin Australia (Cornerstone: 0 jobs — enabled, no current openings).
#   These are live but return no jobs currently; fetcher will auto-pick up jobs when employers hire.
# Checked 12 Oct 2026 — HTTP errors retry (24h window passed): all still blocked or inaccessible:
#   LATAM Airlines (HTTP 403 block persists), Avianca (HTTP 403 block persists), Copa Airlines (HTTP 401 block persists)
#   Note: detect_report shows these still return HTTP errors when accessed; cannot be added without bypassing blocks.
# Checked 12 Oct 2026 — portal decommissioned:
#   dnata (iCIMS: careers-dnata.icims.com returned 404 on all paths — portal migrated or decommissioned).
# Checked 14 Oct 2026 — verified and enabled:
#   Cathay Pacific (Phenom, 210 jobs).
# Checked 14 Oct 2026 — robots.txt blocks:
#   Menzies Aviation (SmartRecruiters API), ST Engineering (Oracle), Dubai Airports (Oracle).
# Checked 14 Oct 2026 — HTTP errors:
#   Safran (HTTP 403), AAR Workday (HTTP 422 — retesting as Taleo).
# Checked 14 Oct 2026 — SF connector incompatible:
#   Bombardier (SuccessFactors KeyError — missing url field), Dubai Airports v2 (same).
# Custom/JS sites (not yet attempted):
#   Turkish Airlines (custom ASP.NET).
# Unsupported ATS: Emirates (Avature), Aer Lingus (Zellis),
#   WestJet (Dayforce), Kenya Airways (Oracle iRecruitment on-premise), many others (custom sites).
#   (British Airways corrected 14 Oct 2026: uses Cornerstone, already enabled above — comment was stale.)
# Checked 14 Oct 2026 — master-list sweep (224 employers researched, 145 never-before-checked candidates
# detected against): 6 verified and enabled (Travelport, Accelya, Gogo Business Aviation, Moog,
# Crane Aerospace, Cirrus Aircraft). Rejected: Chubb Aerospace (400 "jobs" were Chubb's entire global
# insurance job board — not an aerospace-specific feed; samples included "Chubb Life HK", "Underwriter,
# Marine & Specialty" — excluded to avoid polluting the site with non-aviation roles).
# Still blocked/no-jobs from this sweep: Spirit AeroSystems (robots.txt on iCIMS), Arup, Jet Aviation,
# ExxonMobil, TotalEnergies, Neste, Aon Aerospace (all returned 0 jobs — site exists but ATS detection
# found an empty or wrong endpoint), OAG (HTTP 404, Greenhouse board name was a guess).
# 104 of the 145 never-checked candidates had no detectable public hiring system at all (most are
# lessors, consulting firms, insurers and ANSPs likely using LinkedIn/Indeed only, or JS-rendered portals
# with no public API) — see docs/STATUS.md for the full breakdown.
# Batch 2, 14 Oct 2026 (refined URLs via web search for manufacturers/ANSPs/business aviation):
#   Woodward (Workday, 188 jobs, clean) and Thales (Workday, 400 jobs, mixed group-wide feed — kept,
#   see note above) enabled. Pilatus Aircraft (SF detection was a false positive, 404 on real fetch)
#   and Textron (Taleo detected but returned 0 jobs) not added.
#   Still no public ATS found: Dassault Aviation, Leonardo, Eurocontrol (robots.txt), DFS, ENAIRE,
#   Airservices Australia, Airways NZ (HTTP 403), NetJets, Flexjet, Wheels Up, Diehl, Mitsubishi Heavy
#   Industries, Kawasaki Heavy Industries. These are likely JS-rendered portals or use systems without
#   a public API; would need browser network inspection to find a real endpoint, if one exists.
#
# Source examples (copy the shape that matches the hiring system):
#   source: {ats: workday, url: "https://company.wd3.myworkdayjobs.com/SiteName"}
#   source: {ats: greenhouse, board: "companyboardname"}
#   source: {ats: lever, company: "companyname"}            # add region: eu for EU accounts
#   source: {ats: smartrecruiters, company: "CompanyIdentifier"}
#   source: {ats: jsonld, listing_url: "https://careers.example.com/jobs", job_link_pattern: "/job/"}

