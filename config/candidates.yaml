# Candidate sources to TEST (python -m fetcher.verify). Nothing here is switched on.
# 15 Oct 2026 – Round 3: hh.ru connector for Russian aviation employers.
#
# Previous rounds (1–2): All jsonld/workday attempts failed for Russian employers.
# Root cause: Russian airlines/airports post on hh.ru (HeadHunter), not their own
# scrapable pages. New hhru connector built — fetch_hhru() in fetcher/connectors.py.
#
# hh.ru employer IDs confirmed via hh.ru/employer/<id>:
#   Aeroflot:          1373   (hh.ru/employer/1373)
#   Rossiya Airlines:  125493 (hh.ru/employer/125493)
#   S7 Airlines:       766468 (hh.ru/employer/766468)
#   Ural Airlines:     12115148 (hh.ru/employer/12115148)
#   Utair:             12327122 (hh.ru/employer/12327122)
#   Sheremetyevo SVO:  229    (hh.ru/employer/229)
#
# Still to find: Pobeda Airlines, Vnukovo (VKO), Pulkovo (LED) employer IDs.

employers:
  # ──────────────────────────────
  # RUSSIA — AIRLINES (hh.ru)
  # ──────────────────────────────

  # Aeroflot: Russia's flag carrier — 33,000+ employees, largest airline in Russia.
  # hh.ru/employer/1373 confirmed: employer page live with aviation vacancies.
  - name: Aeroflot
    slug: aeroflot
    country: RU
    type: airline
    source: {ats: hhru, employer_id: "1373"}

  # Rossiya Airlines: Aeroflot Group subsidiary, St Petersburg base, ~6,000 staff.
  # hh.ru/employer/125493 confirmed.
  - name: Rossiya Airlines
    slug: rossiya-airlines
    country: RU
    type: airline
    source: {ats: hhru, employer_id: "125493"}

  # S7 Airlines: Russia's second-largest carrier, Novosibirsk base.
  # hh.ru/employer/766468 confirmed.
  - name: S7 Airlines
    slug: s7-airlines
    country: RU
    type: airline
    source: {ats: hhru, employer_id: "766468"}

  # Ural Airlines: Major regional airline, Yekaterinburg base.
  # hh.ru/employer/12115148 confirmed.
  - name: Ural Airlines
    slug: ural-airlines
    country: RU
    type: airline
    source: {ats: hhru, employer_id: "12115148"}

  # Utair: Russian regional carrier, Surgut base. Many domestic routes.
  # hh.ru/employer/12327122 confirmed.
  - name: Utair
    slug: utair
    country: RU
    type: airline
    source: {ats: hhru, employer_id: "12327122"}

  # ──────────────────────────────
  # RUSSIA — AIRPORTS (hh.ru)
  # ──────────────────────────────

  # Sheremetyevo (SVO): Russia's busiest airport — 45M+ passengers/year, Moscow.
  # hh.ru/employer/229 confirmed: АО Международный аэропорт Шереметьево.
  - name: Sheremetyevo Airport (SVO)
    slug: sheremetyevo-airport
    country: RU
    type: airport
    source: {ats: hhru, employer_id: "229"}

  # ──────────────────────────────
  # ISRAEL — AIRLINES
  # ──────────────────────────────
  # Note: All Israeli employers failed in Rounds 1–2 due to robots.txt or JS rendering.
  # Leaving these in as low-priority candidates in case a future connector helps.

  # El Al: national carrier. Jobs rendered by JavaScript; blocked GitHub Actions IPs.
  # Keeping as-is in case jsonld page loads improve.
  - name: El Al
    slug: elal
    country: IL
    type: airline
    source: {ats: jsonld, listing_url: "https://www.elal.com/en/careers/job-search?page={page}", job_link_pattern: "/careers/job/", max_pages: 5, strip_query: true}

  # ──────────────────────────────
  # AVATURE (new connector, 20 Oct 2026)
  # ──────────────────────────────
  # Qatar Airways: verify.yml confirmed real jobs on 20 Oct 2026 (ok: true, 6 sampled,
  # real titles/locations/dates) — now enabled directly in config/employers.yaml, so
  # it's removed from here.
  #
  # Emirates also runs Avature (emiratesjobs.avature.net) but its public-facing
  # careers.emiratesgroupcareers.com flow redirects to a login page before showing
  # any jobs — not a candidate, not included here. See docs/STATUS.md.

