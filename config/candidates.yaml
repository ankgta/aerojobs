  # IBS Software: Aviation IT company (India). Oracle confirmed at careers.ibsplc.com.
  # Oracle host fa-etbm-saasfaprod1.fa.ocs.oraclecloud.com, site CX_1 found via browser
  # inspection of the careers.ibsplc.com Oracle redirect.
  - name: IBS Software
    slug: ibs-software
    country: IN
    type: software
    source: {ats: oracle, host: "fa-etbm-saasfaprod1.fa.ocs.oraclecloud.com", site: "CX_1"}

  # WSP: Engineering consultancy (Canada). Oracle confirmed at wsp.com/en-us/careers.
  # Oracle host emit.fa.ca3.oraclecloud.com, site CX_2001 found via careers page.
  # NOTE: WSP is multi-sector (not aviation-only). Check sample titles before enabling.
  - name: WSP
    slug: wsp
    country: CA
    type: other
    source: {ats: oracle, host: "emit.fa.ca3.oraclecloud.com", site: "CX_2001"}

  # Do & Co: Premium airline catering (Austria). SmartRecruiters confirmed via
  # jobs.smartrecruiters.com/DOCO1/ — 271 jobs on careers.doco.com.
  # Genuine airline catering company: caterers for F1, airlines, sports events.
  - name: Do & Co
    slug: do-and-co
    country: AT
    type: ground_services
    source: {ats: smartrecruiters, company: "DOCO1"}

  # IFS: Enterprise software for Aerospace & Defense (Sweden). SmartRecruiters confirmed
  # via careers.smartrecruiters.com/IFS1. Has specific A&D division with real aviation jobs.
  - name: IFS
    slug: ifs
    country: SE
    type: software
    source: {ats: smartrecruiters, company: "IFS1"}

