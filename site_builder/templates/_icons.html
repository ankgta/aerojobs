{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "pin" %}<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
{%- elif name == "building" %}<path d="M4 21V5l8-2v18M12 8h8v13M8 8v.01M8 12v.01M8 16v.01M16 12v.01M16 16v.01M2 21h20"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == "menu" %}<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == "close" %}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == "sliders" %}<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>
{%- elif name == "external" %}<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- endif %}</svg>
{%- endmacro %}

{% macro brand_mark() -%}
<svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0A66E8"/><path d="M10.5 24.5 18 7h4.5l-2.3 17.5z" fill="#fff"/><path d="M7 24.5h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="2.6" fill="#FFC53D"/></svg>
{%- endmacro %}
